# Local observability stack: the Product API + Prometheus + Grafana.
#   cd observability && docker compose up --build
# App:        http://localhost:8080   (metrics at /metrics)
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000   (dashboard "Product Service - RED Signals")
services:
  app:
    build: ../src
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      # Local-only convenience: skip the login screen.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
